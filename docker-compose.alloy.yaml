services:
  # User-facing frontend: StreamLine Spotlight prototype (Vite dev server on 3000).
  app:
    image: node:22-bookworm
    working_dir: /workspace/app
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      PORT: "3000"
    volumes:
      - .:/workspace
    command: bash -lc "npm install --no-audit --no-fund && npm run dev"

  # Project documentation / PM deliverables viewer (secondary, on 4000).
  docs:
    image: node:22-bookworm
    working_dir: /workspace/.alloy
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      DOCS_ROOT: /workspace
      PORT: "4000"
    volumes:
      - .:/workspace
    command: bash -lc "npm install --no-audit --no-fund && npm start"
